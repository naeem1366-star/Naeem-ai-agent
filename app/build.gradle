plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.naeem.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.naeem.ai'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '2.0.0-alpha04'
    }

    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.23.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}


// Download the official open-source Vazirmatn font files at build time.
// The APK bundles the fonts locally, so the app does not need internet to render Persian text.
def vazirmatnFontFiles = [
    "Vazirmatn-Regular.ttf",
    "Vazirmatn-Medium.ttf",
    "Vazirmatn-SemiBold.ttf",
    "Vazirmatn-Bold.ttf"
]
tasks.register("downloadVazirmatnFonts") {
    outputs.files(vazirmatnFontFiles.collect { file("$projectDir/src/main/res/font/" + it.toLowerCase().replace("-", "_")) } + [file("$projectDir/src/main/assets/fonts/OFL.txt")])
    doLast {
        def fontDir = file("$projectDir/src/main/res/font")
        fontDir.mkdirs()
        def licenseFile = file("$projectDir/src/main/assets/fonts/OFL.txt")
        licenseFile.parentFile.mkdirs()
        if (!licenseFile.exists() || licenseFile.length() < 1000L) {
            new URL("https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/OFL.txt").withInputStream { input -> licenseFile.withOutputStream { output -> output << input } }
        }
        vazirmatnFontFiles.each { fontName ->
            def targetName = fontName.toLowerCase().replace("-", "_")
            def target = new File(fontDir, targetName)
            if (!target.exists() || target.length() < 1000L) {
                def url = new URL("https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/" + fontName)
                url.withInputStream { input -> target.withOutputStream { output -> output << input } }
            }
        }
    }
}
tasks.named("preBuild").configure { dependsOn("downloadVazirmatnFonts") }


def moduleBackdropImages = [
    "bg_mountain.jpg": "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200&q=82&fit=crop",
    "bg_travel.jpg": "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200&q=82&fit=crop",
    "bg_finance.jpg": "https://images.unsplash.com/photo-1460925895917-afdab8272f5f?w=1200&q=82&fit=crop",
    "bg_art.jpg": "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=1200&q=82&fit=crop",
    "bg_games.jpg": "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200&q=82&fit=crop",
    "bg_wrapped.jpg": "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=1200&q=82&fit=crop",
    "bg_abstract.jpg": "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1200&q=82&fit=crop"
]
tasks.register("downloadModuleBackdropImages") {
    outputs.files(moduleBackdropImages.keySet().collect { file("$projectDir/src/main/res/drawable-nodpi/" + it) })
    doLast {
        def imageDir = file("$projectDir/src/main/res/drawable-nodpi")
        imageDir.mkdirs()
        moduleBackdropImages.each { fileName, imageUrl ->
            def target = new File(imageDir, fileName)
            if (!target.exists() || target.length() < 12000L) {
                try {
                    new URL(imageUrl).withInputStream { input -> target.withOutputStream { output -> output << input } }
                    if (target.length() < 12000L) { target.delete(); throw new GradleException("Backdrop image download was incomplete: " + fileName) }
                } catch (Exception ex) {
                    if (!target.exists()) throw new GradleException("Could not download required backdrop image " + fileName, ex)
                    throw ex
                }
            }
        }
    }
}
tasks.named("preBuild").configure { dependsOn("downloadModuleBackdropImages") }
