name: Supabase Edge Function checks
on:
  push:
    branches: ["fix/ema-free-chat-gapgpt", "feature/ema-asi-platform", "feature/ema-provider-account-monitoring", "feature/ema-free-image-tools-gapgpt", "feature/ema-netarz-paid-ai-routing", "feature/ema-netarz-media-secure-routing", "feature/ema-autonomous-core-memory", "feature/ema-social-platform"]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-checks.yml"
  pull_request:
    branches: ["feature/ema-asi-platform", "feature/ema-provider-account-monitoring", "feature/ema-free-image-tools-gapgpt", "feature/ema-netarz-paid-ai-routing", "feature/ema-netarz-media-secure-routing", "feature/ema-autonomous-core-memory", "feature/ema-social-platform"]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-checks.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check EMA secure gateway
        run: deno check --no-lock supabase/functions/smooth-service/index.ts
      - name: Type-check EMA Social API
        run: deno check --no-lock supabase/functions/ema-social/index.ts

  social-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ema_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal Supabase-compatible test schema
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/ema_test" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE TABLE public.ema_admin_users (
            user_id uuid PRIMARY KEY REFERENCES auth.users(id),
            role text NOT NULL CHECK (role IN ('admin','superadmin'))
          );
          SQL
      - name: Apply EMA Social migration to ephemeral PostgreSQL
        run: psql "postgresql://postgres:postgres@localhost:5432/ema_test" -v ON_ERROR_STOP=1 -f supabase/migrations/0008_ema_social_platform.sql
      - name: Verify default-off kill switch and RLS
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/ema_test" -v ON_ERROR_STOP=1 -Atc "SELECT enabled FROM public.ema_feature_controls WHERE feature_key='social_network';" | grep -qx f
          psql "postgresql://postgres:postgres@localhost:5432/ema_test" -v ON_ERROR_STOP=1 -Atc "SELECT bool_and(relrowsecurity) FROM pg_class WHERE (relname LIKE 'ema_social_%' OR relname='ema_feature_controls') AND relkind IN ('r','p');" | grep -qx t

  credit-wallet-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ema_credit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ema_credit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal Supabase-compatible billing schema
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/ema_credit_test" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, email text);
          CREATE TABLE public.ema_profiles (user_id uuid PRIMARY KEY REFERENCES auth.users(id), email text, updated_at timestamptz DEFAULT now());
          CREATE TABLE public.ema_wallets (user_id uuid PRIMARY KEY REFERENCES auth.users(id), balance_toman bigint NOT NULL DEFAULT 0, updated_at timestamptz DEFAULT now());
          CREATE TABLE public.ema_billing_settings (singleton boolean PRIMARY KEY DEFAULT true, ai_billing_enabled boolean NOT NULL DEFAULT false, usd_to_toman numeric(18,2) NOT NULL DEFAULT 0, markup_bps integer NOT NULL DEFAULT 3000, subscription_ai_credit_percent integer NOT NULL DEFAULT 50, updated_at timestamptz DEFAULT now());
          INSERT INTO public.ema_billing_settings(singleton) VALUES(true);
          CREATE TABLE public.ema_payment_orders (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL REFERENCES auth.users(id), order_type text NOT NULL, plan_id text, amount_toman bigint NOT NULL, status text NOT NULL DEFAULT 'pending', receipt_note text, reviewed_by uuid, reviewed_at timestamptz, updated_at timestamptz DEFAULT now());
          CREATE TABLE public.ema_usage_events (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL REFERENCES auth.users(id), reservation_id uuid, feature text NOT NULL, provider text NOT NULL, model text NOT NULL, input_tokens bigint DEFAULT 0, output_tokens bigint DEFAULT 0, provider_cost_usd numeric DEFAULT 0, charged_toman bigint DEFAULT 0, metadata jsonb DEFAULT '{}'::jsonb);
          CREATE TABLE public.ema_provider_cost_ledger (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid, usage_event_id uuid, provider text NOT NULL, model text NOT NULL, cost_usd numeric NOT NULL);
          CREATE TABLE public.ema_admin_users (user_id uuid PRIMARY KEY REFERENCES auth.users(id));
          CREATE TABLE public.ema_audit_log (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), actor_user_id uuid, action text NOT NULL, target_user_id uuid, details jsonb DEFAULT '{}'::jsonb);
          CREATE TABLE public.ema_plans (id text PRIMARY KEY, name text NOT NULL, duration_days integer NOT NULL, price_toman bigint NOT NULL, ai_credit_percent integer NOT NULL DEFAULT 50, enabled boolean NOT NULL DEFAULT true);
          CREATE TABLE public.ema_subscriptions (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL, plan_id text NOT NULL, starts_at timestamptz NOT NULL, ends_at timestamptz NOT NULL, payment_order_id uuid);
          SQL
      - name: Apply credit wallet reconciliation migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres:postgres@localhost:5432/ema_credit_test" -v ON_ERROR_STOP=1 -f supabase/migrations/0010_ema_credit_wallet_reconcile.sql
      - name: Verify signup gift, atomic reserve, settle and release
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/ema_credit_test" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id,email) VALUES ('00000000-0000-0000-0000-000000000123','credit-test@example.invalid');
          DO $$
          DECLARE v_balance bigint; v_reservation uuid; v_result jsonb;
          BEGIN
            SELECT balance_credits INTO v_balance FROM public.ema_credit_wallets WHERE user_id='00000000-0000-0000-0000-000000000123';
            IF v_balance <> 10000 THEN RAISE EXCEPTION 'signup gift mismatch: %', v_balance; END IF;
            v_result := public.ema_reserve_credits('00000000-0000-0000-0000-000000000123',2000,'ci-reserve-key-0001','think_room','gpt-test');
            v_reservation := (v_result->>'reservation_id')::uuid;
            PERFORM public.ema_settle_credits(v_reservation,1500,'NetArz',100,50,0.01,100);
            SELECT balance_credits INTO v_balance FROM public.ema_credit_wallets WHERE user_id='00000000-0000-0000-0000-000000000123';
            IF v_balance <> 8500 THEN RAISE EXCEPTION 'settlement balance mismatch: %', v_balance; END IF;
            v_result := public.ema_reserve_credits('00000000-0000-0000-0000-000000000123',1000,'ci-reserve-key-0002','think_room','gpt-test');
            v_reservation := (v_result->>'reservation_id')::uuid;
            PERFORM public.ema_release_credits(v_reservation,'ci_test');
            SELECT balance_credits INTO v_balance FROM public.ema_credit_wallets WHERE user_id='00000000-0000-0000-0000-000000000123';
            IF v_balance <> 8500 THEN RAISE EXCEPTION 'release balance mismatch: %', v_balance; END IF;
          END $$;
          SQL
