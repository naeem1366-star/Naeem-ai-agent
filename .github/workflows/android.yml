name: Android APK
on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/v2-foundation", "feature/pc-bridge-mvp", "feature/ima-chat-gateway", "feature/ema-asi-platform", "feature/ema-owner-admin-dashboard", "feature/ema-tools-free-paid-access"]
  pull_request:
    branches: ["feature/v2-foundation", "feature/ema-asi-platform", "feature/ema-owner-admin-dashboard"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Read app version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E '^[[:space:]]*versionName[[:space:]]+' app/build.gradle | head -n 1 | sed -E "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle" >&2
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=EMA-ASI-PLATFORM-v$VERSION_NAME.apk" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Name versioned APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APK_NAME"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EMA-ASI-PLATFORM-v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          if-no-files-found: error
      - name: Publish Android APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/pc-bridge-mvp'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-bridge-${{ env.VERSION_NAME }}
          name: Naeem AI Desktop Bridge ${{ env.VERSION_NAME }}
          prerelease: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish EMA ASI Platform APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/ema-asi-platform'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ema-asi-platform-${{ env.VERSION_NAME }}
          name: EMA ASI PLATFORM ${{ env.VERSION_NAME }}
          prerelease: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
