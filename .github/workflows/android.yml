name: Android APK
on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/v2-foundation", "feature/pc-bridge-mvp", "feature/ima-chat-gateway", "feature/ema-asi-platform"]
  pull_request:
    branches: ["feature/v2-foundation"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          CHAT_GATEWAY_URL: ${{ vars.CHAT_GATEWAY_URL }}
        run: gradle -PCHAT_GATEWAY_URL=\"$CHAT_GATEWAY_URL\" assembleDebug
      - name: Name versioned APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EMA-ASI-PLATFORM-v2.0.0-alpha25.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EMA-ASI-PLATFORM-v2.0.0-alpha25
          path: app/build/outputs/apk/debug/IMA-v2.0.0-alpha25.apk
          if-no-files-found: error
      - name: Publish Android APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/pc-bridge-mvp'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-bridge-alpha1
          name: Naeem AI Desktop Bridge alpha1
          prerelease: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/EMA-ASI-PLATFORM-v2.0.0-alpha25.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
