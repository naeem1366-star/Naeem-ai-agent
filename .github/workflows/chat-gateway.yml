name: EMA ASI PLATFORM Chat Gateway Checks
on:
  push:
    branches: ["feature/ima-chat-gateway", "feature/ema-asi-platform"]
    paths:
      - "backend/auth-worker/**"
      - ".github/workflows/chat-gateway.yml"
  pull_request:
    branches: ["feature/v2-foundation"]
    paths:
      - "backend/auth-worker/**"
      - ".github/workflows/chat-gateway.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/auth-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
