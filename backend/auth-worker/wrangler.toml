name = "naeem-ai-auth"
main = "src/index.ts"
compatibility_date = "2026-11-25"

[[d1_databases]]
binding = "DB"
database_name = "naeem-ai-auth"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
GHASEDAK_TEMPLATE_NAME = "naeem_login"
ALLOWED_ORIGINS = ""

[assets]
directory = "./public"
binding = "ASSETS"
